# The relay on the Hetzner box: cloudmorrow.tech, DNS at Cloudflare, the
# website on the same machine behind it. Mounted read-only at
# /etc/cloudmorrow-relay/relay.toml by docker-compose.yml in this folder.
#
# Names come only through linking (open_claims is off): the website
# approves link codes over the admin API, with $RELAY_ADMIN_SECRET from
# /srv/cloudmorrow-relay/secrets.env.

zone = "cloudmorrow.tech"
relay_host = "relay.cloudmorrow.tech"   # access_control = "https://relay.cloudmorrow.tech"
login_host = "mesh.cloudmorrow.tech"
state_dir = "/var/lib/cloudmorrow-relay"   # /srv/cloudmorrow-relay/state on the host
public_ipv4 = "178.105.27.139"
reserved = []

# Visitors to a cloud's name are passed through to its box over the mesh.
# The host is on the mesh as tag:relay (tailscaled in kernel mode; see the
# README, "Putting the relay on the mesh"), and the relay, with host
# networking, dials the boxes' 100.64.x.x addresses directly.
mesh_dial = "direct"
# The host's own mesh addresses, handed to every box: the only addresses
# its Caddy takes a PROXY protocol header from. Empty: read from Headscale,
# the nodes tagged tag:relay (only the operator can tag one).
relay_addresses = []

[listen]
addresses = ["0.0.0.0", "::"]
https_port = 443
http_port = 80

[dns]
# The zone is at Cloudflare with *.cloudmorrow.tech and cloudmorrow.tech
# A 178.105.27.139, DNS only. The relay writes just the _acme-challenge
# TXT records (and the name beside one), tagged "cloudmorrow-relay".
# Token: $CLOUDFLARE_API_TOKEN from /srv/cloudmorrow-relay/secrets.env.
backend = "cloudflare"

[tls]
# *.cloudmorrow.tech from Let's Encrypt by DNS-01 through the same
# Cloudflare token: relay., mesh. and every cloud's offline page. Renewed by
# itself, re-read without a restart. Kept in state_dir/tls, lego's own
# files in state_dir/lego.
acme = "lego"
acme_challenge = "dns-cloudflare"

[headscale]
url = "http://127.0.0.1:18080"
api_key_file = "/etc/cloudmorrow-relay/headscale-api-key"
extra_records_path = "/var/lib/headscale-dns/extra-records.json"

# The website (cloudmorrow.com, proxied by Cloudflare) and later the shop,
# served by the `website` service on this machine. 443 goes through as it
# came (the website does its own TLS); 80 by Host. The website calls the
# admin API at https://relay.cloudmorrow.tech/admin/v1.
[[routes]]
sni = ["cloudmorrow.com", "www.cloudmorrow.com"]
upstream = "127.0.0.1:8443"

[[routes]]
host = ["cloudmorrow.com", "www.cloudmorrow.com"]
upstream = "127.0.0.1:8080"
